<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Watch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; }
        .video-container { width: 90%; max-width: 1000px; text-align: center; }
        .video-container iframe { width: 100%; height: 500px; border: none; border-radius: 12px; }
        .back-link { display: inline-block; margin-top: 20px; color: #e50914; text-decoration: none; font-size: 1rem; }
        h1 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; }
        .error-msg { color: #ff4444; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="video-container">
        <h1 id="movieTitle">🎬 Duke ngarkuar...</h1>
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        <br><a href="javascript:history.back()" class="back-link">← Kthehu te faqja kryesore</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const id = urlParams.get('id');  // kjo është slug, p.sh. YYmY8Qy-M
        const season = urlParams.get('season');
        const episode = urlParams.get('episode');
        const title = decodeURIComponent(urlParams.get('title') || '');

        let videoUrl = '';

        if (title) {
            document.getElementById('movieTitle').innerHTML = `🎬 ${title}`;
        }

        if (type === 'movie') {
            // Përdor API-në e saktë të Abyss
            if (id) {
                videoUrl = `https://abyss.to/api/v1/getVideo/${id}`;
                document.getElementById('movieTitle').innerHTML = `🎬 Duke ngarkuar filmin...`;
            } else {
                document.getElementById('movieTitle').innerHTML = '❌ ID e filmit nuk u gjet';
            }
        } else if (type === 'tv') {
            if (id && season && episode) {
                videoUrl = `https://abyss.to/api/v1/getVideo/${id}?season=${season}&episode=${episode}`;
                document.getElementById('movieTitle').innerHTML = `📺 Sezoni ${season}, Episodi ${episode}`;
            } else {
                document.getElementById('movieTitle').innerHTML = '❌ Parametrat e serialit nuk u gjetën';
            }
        }

        if (videoUrl) {
            document.getElementById('videoFrame').src = videoUrl;
            // Nëse iframe nuk ngarkohet pas 10 sekondave, trego gabim
            setTimeout(() => {
                const iframe = document.getElementById('videoFrame');
                if (iframe && !iframe.src) {
                    document.getElementById('movieTitle').innerHTML = '⚠️ Video nuk u ngarkua. Provo të rifreskosh faqen.';
                }
            }, 10000);
        } else {
            document.getElementById('videoFrame').style.display = 'none';
            document.getElementById('movieTitle').innerHTML = '❗ Linku i videos nuk është i disponueshëm';
        }
    </script>
</body>
</html>
