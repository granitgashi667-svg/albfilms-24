<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Watch</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; }
        .video-container { width: 90%; max-width: 1000px; text-align: center; }
        .video-container iframe { width: 100%; height: 500px; border: none; border-radius: 12px; }
        .back-link { display: inline-block; margin-top: 20px; color: #e50914; text-decoration: none; font-size: 1rem; }
        h1 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="video-container">
        <h1 id="movieTitle">🎬 Duke ngarkuar...</h1>
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        <br><a href="javascript:history.back()" class="back-link">← Kthehu te faqja kryesore</a>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const type = urlParams.get('type');
        let title = decodeURIComponent(urlParams.get('title') || '');

        if (title) {
            document.getElementById('movieTitle').innerText = title;
        }

        let videoUrl = '';
        if (type === 'abyss') {
            videoUrl = `https://abyss.to/v/${slug}`;
        } else if (type === 'vidmoly') {
            // Vidmoly mund të ketë dy formate: /e/ ose /embed/
            // Provo fillimisht /e/ (formati i zakonshëm)
            videoUrl = `https://vidmoly.com/e/${slug}`;
            // Nëse nuk funksionon, mund të ndryshosh manualisht në /embed/
        } else {
            // Nëse vjen nga TMDB (id numerik), nuk ka slug/type - tregojmë mesazh
            const id = urlParams.get('id');
            if (id && !isNaN(id)) {
                document.getElementById('movieTitle').innerHTML = '❌ Ky film nga TMDB nuk ka link të drejtpërdrejtë. <br> Nevojitet burim abyss/vidmoly.';
            } else {
                document.getElementById('movieTitle').innerText = '❌ Burim i panjohur ose slug i gabuar.';
            }
        }

        if (videoUrl) {
            document.getElementById('videoFrame').src = videoUrl;
        } else if (!slug && !(urlParams.get('id') && !isNaN(urlParams.get('id')))) {
            document.getElementById('movieTitle').innerText = '❌ Slug i filmit nuk u gjet.';
        }
    </script>
</body>
</html>
