<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Watch</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .video-container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 520px;
            border: none;
            border-radius: 12px;
        }

        h1 {
            color: #fff;
            margin-bottom: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #e50914;
            text-decoration: none;
        }

        .error {
            margin-top: 20px;
            background: #2a0a0a;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="video-container">
    <h1 id="movieTitle">🎬 Duke ngarkuar...</h1>

    <iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe>

    <br>
    <a href="javascript:history.back()" class="back-link">← Kthehu</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const slug = params.get('slug');
const type = params.get('type');
const title = params.get('title');

if (title) {
    document.getElementById("movieTitle").innerText = decodeURIComponent(title);
}

// ================= PLAYER LOGIC =================
let videoUrl = "";

// 👉 ABYSS (FIXED)
if (type === "abyss" && slug) {
    videoUrl = `https://abyss.to/embed-${slug}.html`;
}

// 👉 VIDMOLY
else if (type === "vidmoly" && slug) {
    videoUrl = `https://vidmoly.com/e/${slug}`;
}

// 👉 DIRECT LINK (testim)
else if (slug && slug.startsWith("http")) {
    videoUrl = slug;
}

// ================= APPLY =================
const iframe = document.getElementById("player");

if (videoUrl) {
    iframe.src = videoUrl;
} else {
    document.querySelector(".video-container").innerHTML += `
        <div class="error">
            ❌ Gabim: Nuk u gjet video. Kontrollo slug/type.
        </div>
    `;
}

// ================= ERROR CHECK =================
setTimeout(() => {
    try {
        if (!iframe.src || iframe.src === "") throw "no src";
    } catch (e) {
        document.querySelector(".video-container").innerHTML += `
            <div class="error">
            ⚠️ Video nuk mund të ngarkohet.<br>
            Shumë hosta (si abyss) bllokojnë iframe.
            </div>
        `;
    }
}, 3000);
</script>

</body>
</html>
