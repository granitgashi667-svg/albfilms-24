<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Watch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; }
        .video-container { width: 90%; max-width: 1000px; text-align: center; }
        .video-container iframe { width: 100%; height: 500px; border: none; border-radius: 12px; }
        .back-link { display: inline-block; margin-top: 20px; color: #e50914; text-decoration: none; font-size: 1rem; }
        h1 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="video-container">
        <h1 id="movieTitle">🎬 Duke ngarkuar...</h1>
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        <br><a href="javascript:history.back()" class="back-link">← Kthehu te faqja kryesore</a>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const id = urlParams.get('id');
        const season = urlParams.get('season');
        const episode = urlParams.get('episode');
        
        let videoUrl = '';
        
        // Lidhjet e Abyss (zëvendësoji me ID-të e tua)
        const videoLinks = {
            "movie_27205": "https://abyss.to/v/YYmY8Qy-M",
            "tv_1396_1_1": "https://abyss.to/v/xxxxx"
        };
        
        if (type === 'movie') {
            videoUrl = videoLinks[`movie_${id}`] || `https://abyss.to/v/${id}`;
            document.getElementById('movieTitle').innerText = '🎬 Duke ngarkuar filmin...';
        } else if (type === 'tv') {
            videoUrl = videoLinks[`tv_${id}_${season}_${episode}`] || `https://abyss.to/v/${id}`;
            document.getElementById('movieTitle').innerText = `📺 Sezoni ${season}, Episodi ${episode}`;
        }
        
        if (videoUrl) {
            document.getElementById('videoFrame').src = videoUrl;
        } else {
            document.getElementById('videoFrame').parentElement.innerHTML = '<h3 style="color:#fff;">Video link not available yet</h3><a href="index.html" class="back-link">← Kthehu te faqja kryesore</a>';
        }
    </script>
</body>
</html>
