<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Shiko Filmin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; }
        .video-container { width: 90%; max-width: 1000px; text-align: center; }
        .video-container iframe { width: 100%; height: 500px; border: none; border-radius: 12px; }
        .back-link { display: block; margin-top: 20px; color: #e50914; text-decoration: none; }
        h1 { color: #fff; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="video-container">
        <h1 id="movieTitle">🎬 Duke ngarkuar...</h1>
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        <a href="index.html" class="back-link">← Kthehu te faqja kryesore</a>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const title = decodeURIComponent(urlParams.get('title') || '');
        if (title) document.getElementById('movieTitle').innerText = title;
        if (slug) {
            document.getElementById('videoFrame').src = 'https://abyss.to/v/' + slug;
        } else {
            document.getElementById('movieTitle').innerText = '❌ Film jo i disponueshëm';
        }
    </script>
</body>
</html>
