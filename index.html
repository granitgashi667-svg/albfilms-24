<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Testimi i 2 Filmave</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 10px; color: #e50914; }
        p { text-align: center; margin-bottom: 40px; color: #aaa; }
        .movies-container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .movie-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; width: 250px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
        .movie-card:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(229,9,20,0.3); }
        .movie-card img { width: 100%; height: 370px; object-fit: cover; background: #333; }
        .movie-info { padding: 15px; text-align: center; }
        .movie-info h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .watch-btn { background: #e50914; color: white; border: none; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .watch-btn:hover { background: #b20710; }
        footer { text-align: center; margin-top: 50px; color: #555; }
        @media (max-width: 600px) { .movies-container { gap: 20px; } .movie-card { width: 200px; } .movie-card img { height: 300px; } }
    </style>
</head>
<body>

<h1>🎬 AlbFilms24</h1>
<p>Kliko mbi "Watch Now" për të parë filmin</p>

<div class="movies-container">
    <!-- Filmi 1 -->
    <div class="movie-card">
        <img src="https://placehold.co/300x450/1a1a1a/e50914?text=14+Days" alt="14 Days">
        <div class="movie-info">
            <h3>14 Days (Girlfriend Intlo) 2025</h3>
            <button class="watch-btn" onclick="playMovie('https://short.icu/YYmY8Qy-M')">▶ Watch Now</button>
        </div>
    </div>

    <!-- Filmi 2 -->
    <div class="movie-card">
        <img src="https://placehold.co/300x450/1a1a1a/e50914?text=Believe+The+Ultimate+Battle" alt="Believe The Ultimate Battle">
        <div class="movie-info">
            <h3>Believe: The Ultimate Battle</h3>
            <button class="watch-btn" onclick="playMovie('https://short.icu/44qkCuGWS')">▶ Watch Now</button>
        </div>
    </div>
</div>

<footer>
    <p>AlbFilms24 © 2025 - Të gjitha të drejtat e rezervuara</p>
</footer>

<script>
    function playMovie(url) {
        window.open(url, '_blank');
    }
</script>

</body>
</html>
