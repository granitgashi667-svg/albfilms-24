<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Watch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .video-container { width: 100%; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; }
        .video-container iframe { width: 90%; height: 85vh; border: none; border-radius: 12px; }
        .back-link { position: fixed; top: 20px; left: 20px; color: #e50914; text-decoration: none; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 30px; z-index: 100; }
        @media (max-width: 768px) { .video-container iframe { width: 95%; height: 70vh; } }
    </style>
</head>
<body>
    <a href="javascript:history.back()" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
    <div class="video-container">
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const id = urlParams.get('id');
        const season = urlParams.get('season');
        const episode = urlParams.get('episode');
        
        let videoUrl = '';
        
        // Këtu vendosni lidhjet e Abyss për çdo film/serial
        const videoLinks = {
            // Filma
            "movie_27205": "https://abyss.to/v/YYmY8Qy-M",  // Shembull
            // Serialet
            "tv_1396_1_1": "https://abyss.to/v/xxxxx"  // Breaking Bad S01E01
        };
        
        if (type === 'movie') {
            videoUrl = videoLinks[`movie_${id}`] || `https://abyss.to/v/${id}`;
        } else if (type === 'tv') {
            videoUrl = videoLinks[`tv_${id}_${season}_${episode}`] || `https://abyss.to/v/${id}`;
        }
        
        if (videoUrl) {
            document.getElementById('videoFrame').src = videoUrl;
        } else {
            document.getElementById('videoFrame').parentElement.innerHTML = '<h3 style="color:#fff;">Video link not available yet</h3>';
        }
    </script>
</body>
</html>
