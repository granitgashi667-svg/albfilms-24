<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AlbFilms24 - Filma & Seriale HD</title>
  <meta name="description" content="Shiko filmat dhe serialet e fundit falas në AlbFilms24. Cilësi HD, përditësim ditor.">
  <meta name="theme-color" content="#141414">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- CSS kryesor -->
  <link rel="stylesheet" href="css/home.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
  <!-- JS -->
  <script defer src="js/home.js"></script>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo-container">
    <i class="fas fa-film"></i>
    <h1>AlbFilms24</h1>
  </div>
  <div class="nav-links">
    <a href="#" class="active">Home</a>
    <a href="#">Movies</a>
    <a href="#">TV Shows</a>
    <div class="search-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search-bar" placeholder="Search films, seriale..." onfocus="openSearchModal()">
    </div>
  </div>
</div>

<!-- BANNER SLIDER -->
<div class="banner-slider">
  <div class="banner-slides" id="banner-slides"></div>
  <div class="banner-dots" id="banner-dots"></div>
  <button class="banner-arrow left" id="banner-prev"><i class="fas fa-chevron-left"></i></button>
  <button class="banner-arrow right" id="banner-next"><i class="fas fa-chevron-right"></i></button>
</div>

<!-- ROW: Filma -->
<div class="row">
  <div class="row-header">
    <h2><i class="fas fa-fire"></i> Trending Movies</h2>
    <div class="slider-controls">
      <button class="slider-arrow left" data-row="movies-list"><i class="fas fa-chevron-left"></i></button>
      <button class="slider-arrow right" data-row="movies-list"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="list" id="movies-list"></div>
</div>

<!-- ROW: Seriale -->
<div class="row">
  <div class="row-header">
    <h2><i class="fas fa-tv"></i> Trending TV Shows</h2>
    <div class="slider-controls">
      <button class="slider-arrow left" data-row="tvshows-list"><i class="fas fa-chevron-left"></i></button>
      <button class="slider-arrow right" data-row="tvshows-list"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="list" id="tvshows-list"></div>
</div>

<!-- ROW: Anime -->
<div class="row">
  <div class="row-header">
    <h2><i class="fas fa-dragon"></i> Trending Anime</h2>
    <div class="slider-controls">
      <button class="slider-arrow left" data-row="anime-list"><i class="fas fa-chevron-left"></i></button>
      <button class="slider-arrow right" data-row="anime-list"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="list" id="anime-list"></div>
</div>

<!-- MODAL (Detajet e filmit) -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-body">
      <img id="modal-image" alt="">
      <div class="modal-text">
        <h2 id="modal-title"></h2>
        <div class="rating" id="modal-rating"></div>
        <p id="modal-description"></p>
        <div class="modal-info">
          <p><strong>Release:</strong> <span id="modal-date"></span></p>
          <p><strong>Genres:</strong> <span id="modal-genres"></span></p>
        </div>
        <a href="#" id="watch-btn" class="watch-btn"><i class="fas fa-play"></i> Watch Now</a>
      </div>
    </div>
  </div>
</div>

<!-- MODAL KËRKIMI -->
<div class="search-modal" id="search-modal">
  <div class="search-modal-content">
    <span class="close-search" onclick="closeSearchModal()">&times;</span>
    <div class="search-modal-header">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="Search movies, TV shows..." autocomplete="off">
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-content">
    <p>&copy; 2025 AlbFilms24. Të gjitha të drejtat e rezervuara.</p>
    <div class="footer-links">
      <a href="disclaimer.html">Disclaimer</a>
      <a href="about.html">About Us</a>
    </div>
  </div>
</footer>

</body>
</html>
