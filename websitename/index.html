<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlbFilms24 - Filma & Seriale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/home.css">
  <script defer src="js/home.js"></script>
  <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo-container">
    <i class="fas fa-film"></i>
    <h1>AlbFilms24</h1>
  </div>
  <div class="nav-links">
    <a href="#" class="active">Home</a>
    <div class="search-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search-bar" placeholder="Search..." onfocus="openSearchModal()">
    </div>
  </div>
</div>

<!-- BANNER -->
<div class="banner-slider">
  <div class="banner-slides" id="banner-slides"></div>
  <div class="banner-dots" id="banner-dots"></div>
  <button class="banner-arrow left" id="banner-prev"><i class="fas fa-chevron-left"></i></button>
  <button class="banner-arrow right" id="banner-next"><i class="fas fa-chevron-right"></i></button>
</div>

<!-- ROW: MOVIES -->
<div class="row">
  <div class="row-header">
    <h2><i class="fas fa-fire"></i> Trending Movies</h2>
    <div class="slider-controls">
      <button class="slider-arrow left" data-row="movies-list"><i class="fas fa-chevron-left"></i></button>
      <button class="slider-arrow right" data-row="movies-list"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="list" id="movies-list"></div>
</div>

<!-- ROW: TV SHOWS -->
<div class="row">
  <div class="row-header">
    <h2><i class="fas fa-tv"></i> Trending TV Shows</h2>
    <div class="slider-controls">
      <button class="slider-arrow left" data-row="tvshows-list"><i class="fas fa-chevron-left"></i></button>
      <button class="slider-arrow right" data-row="tvshows-list"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="list" id="tvshows-list"></div>
</div>

<!-- ROW: POPULAR SERIES (NARCOS EXAMPLE) -->
<div class="row">
  <div class="row-header">
    <h2><i class="fas fa-star"></i> Popular Series</h2>
    <div class="slider-controls">
      <button class="slider-arrow left" data-row="popular-series"><i class="fas fa-chevron-left"></i></button>
      <button class="slider-arrow right" data-row="popular-series"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="list" id="popular-series"></div>
</div>

<!-- MODAL PËR DETAJE -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-body">
      <img id="modal-image" alt="">
      <div class="modal-text">
        <h2 id="modal-title"></h2>
        <div class="rating" id="modal-rating"></div>
        <p id="modal-description"></p>
        <a href="#" id="watch-btn" class="watch-btn"><i class="fas fa-play"></i> Watch Now</a>
      </div>
    </div>
  </div>
</div>

<!-- MODAL KËRKIMI -->
<div class="search-modal" id="search-modal">
  <div class="search-modal-content">
    <span class="close-search" onclick="closeSearchModal()">&times;</span>
    <div class="search-modal-header">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="Search movies or series...">
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-content">
    <p>&copy; 2025 AlbFilms24. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
