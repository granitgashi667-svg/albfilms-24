<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AlbFilms24 | Filma & Seriale HD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; overflow-x: hidden; }
        .navbar { position: fixed; top: 0; width: 100%; background: linear-gradient(180deg, #0a0a0a 0%, transparent 100%); z-index: 1000; padding: 1rem 2rem; backdrop-filter: blur(8px); }
        .nav-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; transition: transform 0.3s; }
        .logo:hover { transform: scale(1.02); }
        .logo-icon { font-size: 2rem; color: #e50914; filter: drop-shadow(0 0 8px rgba(229,9,20,0.5)); }
        .logo-text { font-family: 'Orbitron', monospace; font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #fff, #e50914, #ff6b6b); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; }
        @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .nav-links { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
        .nav-links > a { color: #fff; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-links > a:hover { color: #e50914; }
        .dropdown { position: relative; }
        .dropbtn { background: transparent; color: #fff; border: none; font-size: 1rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; transition: 0.3s; }
        .dropbtn:hover, .dropdown.active .dropbtn { color: #e50914; }
        .dropdown-content { display: none; position: absolute; top: 40px; left: 0; background: rgba(20,20,20,0.98); backdrop-filter: blur(12px); min-width: 220px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(229,9,20,0.3); box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1001; }
        .dropdown-content a { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1.2rem; color: #fff; text-decoration: none; font-size: 0.9rem; transition: 0.2s; border-left: 3px solid transparent; }
        .dropdown-content a i { width: 24px; color: #e50914; }
        .dropdown-content a:hover { background: #e50914; border-left-color: #fff; }
        .dropdown.active .dropdown-content { display: block; }
        .search-bar { display: flex; align-items: center; background: rgba(255,255,255,0.1); border-radius: 40px; padding: 0.5rem 1rem; gap: 0.5rem; transition: 0.3s; }
        .search-bar:focus-within { background: rgba(255,255,255,0.2); box-shadow: 0 0 8px rgba(229,9,14,0.3); }
        .search-bar i { color: #888; }
        .search-bar input { background: none; border: none; color: #fff; outline: none; width: 200px; font-size: 0.9rem; }
        
        /* HERO SLIDER */
        .hero { position: relative; height: 85vh; margin-top: 70px; overflow: hidden; }
        .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; background-size: cover; background-position: center 30%; background-repeat: no-repeat; }
        .hero-slide.active { opacity: 1; }
        .hero-slide::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.5) 100%); }
        .hero-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 2; width: 100%; padding: 2rem; }
        .hero-content h1 { font-family: 'Orbitron', monospace; font-size: 4rem; margin-bottom: 1rem; background: linear-gradient(135deg, #fff, #e50914); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-content p { font-size: 1.2rem; margin-bottom: 2rem; color: #ddd; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .btn-play { background: #e50914; color: #fff; padding: 0.8rem 2rem; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-play:hover { background: #b20710; transform: scale(1.02); }
        .hero-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 3; }
        .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.5); border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .dot.active { background: #e50914; width: 25px; border-radius: 10px; }
        
        .container { max-width: 1400px; margin: 2rem auto; padding: 0 2rem; }
        .row { margin-bottom: 3rem; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .row-header h2 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.8rem; }
        .row-header h2 i { color: #e50914; }
        .view-all { color: #e50914; text-decoration: none; font-size: 0.9rem; }
        .movies-row { display: flex; gap: 1rem; overflow-x: auto; scroll-behavior: smooth; padding-bottom: 0.5rem; }
        .movies-row::-webkit-scrollbar { height: 6px; }
        .movies-row::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 10px; }
        .movies-row::-webkit-scrollbar-thumb { background: #e50914; border-radius: 10px; }
        .movie-card { min-width: 180px; cursor: pointer; transition: transform 0.3s; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .movie-card h4 { margin-top: 0.5rem; text-align: center; font-size: 0.9rem; }
        .rating { text-align: center; font-size: 0.8rem; color: #ffc107; margin-top: 0.3rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: #141414; max-width: 900px; width: 90%; border-radius: 20px; overflow: hidden; animation: fadeIn 0.3s; border: 1px solid rgba(229,9,14,0.3); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .close-modal { float: right; font-size: 28px; font-weight: bold; color: #fff; cursor: pointer; padding: 12px 20px; }
        .close-modal:hover { color: #e50914; }
        .modal-body { display: flex; flex-wrap: wrap; padding: 1.5rem; gap: 1.5rem; }
        .modal-body img { width: 260px; border-radius: 16px; object-fit: cover; }
        .modal-info { flex: 1; }
        .modal-info h2 { font-size: 1.8rem; margin-bottom: 0.8rem; color: #e50914; }
        .modal-meta { display: flex; gap: 1rem; margin-bottom: 1rem; color: #aaa; font-size: 0.9rem; }
        .modal-meta i { margin-right: 0.3rem; }
        .modal-info p { line-height: 1.5; margin-bottom: 1rem; color: #ddd; }
        .modal-genres { margin-bottom: 1rem; color: #aaa; font-size: 0.85rem; }
        .modal-video-placeholder { background: #1a1a1a; border: 2px dashed #333; border-radius: 16px; padding: 1.2rem; text-align: center; margin-top: 1rem; }
        .modal-video-placeholder i { font-size: 2rem; color: #e50914; margin-bottom: 0.5rem; }
        .footer { background: #0a0a0a; border-top: 1px solid #1f1f1f; margin-top: 4rem; padding: 3rem 2rem 1.5rem; text-align: center; }
        .footer p { color: #666; font-size: 0.8rem; }
        @media (max-width: 768px) { .hero-content h1 { font-size: 2.5rem; } .movie-card { min-width: 140px; } .modal-body { flex-direction: column; align-items: center; text-align: center; } .modal-body img { width: 200px; } }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <i class="fas fa-clapperboard logo-icon"></i>
            <span class="logo-text">ALBFILMS24</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <div class="dropdown" id="genreDropdown">
                <button class="dropbtn" id="dropbtn">Movies <i class="fas fa-chevron-down"></i></button>
                <div class="dropdown-content">
                    <a href="#" data-genre="28"><i class="fas fa-fist-raised"></i> Aksion</a>
                    <a href="#" data-genre="18"><i class="fas fa-theater-masks"></i> Dramë</a>
                    <a href="#" data-genre="35"><i class="fas fa-laugh"></i> Komedi</a>
                    <a href="#" data-genre="27"><i class="fas fa-ghost"></i> Tmerr</a>
                    <a href="#" data-genre="878"><i class="fas fa-rocket"></i> Sci-Fi</a>
                </div>
            </div>
            <a href="#">TV Shows</a>
        </div>
        <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Kërko film..." id="searchInput"></div>
    </div>
</nav>

<!-- HERO SLIDER -->
<div class="hero" id="heroSlider">
    <div class="hero-slide active" style="background-image: url('https://image.tmdb.org/t/p/original/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg');"></div>
    <div class="hero-slide" style="background-image: url('https://image.tmdb.org/t/p/original/qJ2tW6WMUDux911r6m7haRef0WH.jpg');"></div>
    <div class="hero-slide" style="background-image: url('https://image.tmdb.org/t/p/original/8WrWjJkzP6ZvK7j8QnL9mKxYz5V.jpg');"></div>
    <div class="hero-slide" style="background-image: url('https://image.tmdb.org/t/p/original/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg');"></div>
    <div class="hero-slide" style="background-image: url('https://image.tmdb.org/t/p/original/3bhkrj58Vtu7enYsRolD1fZdja1.jpg');"></div>
    <div class="hero-content">
        <h1>AlbFilms24</h1>
        <p>Destinacioni yt për filma dhe seriale HD. Eksploro dhe shijo!</p>
        <button class="btn-play" onclick="document.querySelector('.container').scrollIntoView({behavior:'smooth'})"><i class="fas fa-play"></i> Fillo Eksplorimin</button>
    </div>
    <div class="hero-dots" id="heroDots"></div>
</div>

<div class="container">
    <div class="row"><div class="row-header"><h2><i class="fas fa-fire"></i> Trending Now</h2></div><div class="movies-row" id="trendingRow"></div></div>
    <div class="row"><div class="row-header"><h2><i class="fas fa-star"></i> Popular Movies</h2></div><div class="movies-row" id="moviesRow"></div></div>
    <div class="row"><div class="row-header"><h2><i class="fas fa-tv"></i> Popular TV Shows</h2></div><div class="movies-row" id="tvRow"></div></div>
</div>

<div class="modal" id="movieModal">
    <div class="modal-content"><span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-body"><img id="modalImage"><div class="modal-info"><h2 id="modalTitle"></h2><div class="modal-meta"><span id="modalYear"></span><span id="modalRating"></span></div><p id="modalOverview"></p><div class="modal-genres" id="modalGenres"></div><div class="modal-video-placeholder"><i class="fas fa-video"></i><p>Linku i videos do të shtohet së shpejti</p></div></div></div>
    </div>
</div>

<footer class="footer"><p>© 2025 AlbFilms24. Të gjitha të drejtat e rezervuara.</p></footer>

<script>
    const API_KEY = '7a98db423d6e3a5ee922a3e51a09d135';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/w500';
    const LANGUAGE = 'en-US';

    const MOVIES = [278, 238, 155, 680, 27205, 13, 603, 769, 98, 597];
    const TV_SHOWS = [1396, 1435, 124998, 1399, 44217, 1392, 66732, 60573, 71912, 4629];

    const movieDescriptions = {
        278: "Dy të burgosur krijuan një lidhje të jashtëzakonshme gjatë dekadave në burg, duke gjetur shpresë dhe shpengim përmes miqësisë së tyre.",
        238: "Familja kriminale më e fuqishme në New York përballet me sfida kur patriarku kërkon të transferojë pushtetin te djali i tij më i vogël.",
        155: "Batman përballet me Jokerin, një kriminel që synon të shkatërrojë rendin në Gotham dhe të provojë se çdokush mund të korruptohet.",
        680: "Historitë e ndërthurura të dy vrasësve, një boksieri dhe një çifti grabitësish në Los Angeles të viteve '90.",
        27205: "Një hajdut pushton ëndrrat e njerëzve për të vjedhur sekrete korporative, por rrezikon të humbasë veten në realitet.",
        13: "Një burrë me IQ të ulët bëhet dëshmitar i disa prej ngjarjeve më historike të shekullit të 20-të në Amerikë.",
        603: "Një programues zbulon se realiteti që jeton është një simulim dhe bashkohet me rebelët për të luftuar kundër makinave.",
        769: "Rritja dhe rënia e një gangsteri në mafian e New York-ut, treguar përmes syve të tij dhe të shokëve të tij.",
        98: "Një gjeneral romak skllavërohet dhe bëhet gladiator për t'u hakmarrë ndaj perandorit që i vrau familjen.",
        597: "Një artist i ri dhe një grua e klasës së lartë bien në dashuri në bordin e anijes së famshme 'Titanic'."
    };

    async function fetchMovieById(id) {
        const res = await fetch(`${BASE_URL}/movie/${id}?api_key=${API_KEY}&language=${LANGUAGE}`);
        const data = await res.json();
        return {
            id: data.id, title: data.title, year: data.release_date ? data.release_date.split('-')[0] : 'N/A',
            rating: data.vote_average ? data.vote_average.toFixed(1) : 'N/A',
            poster: data.poster_path ? IMG_URL + data.poster_path : 'https://placehold.co/500x750/1a1a1a/e50914?text=No+Poster',
            overview: movieDescriptions[id] || data.overview || 'Përshkrimi nuk është i disponueshëm.',
            genres: data.genres ? data.genres.map(g => g.name).join(', ') : 'N/A'
        };
    }

    async function fetchTvById(id) {
        const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${API_KEY}&language=${LANGUAGE}`);
        const data = await res.json();
        return {
            id: data.id, title: data.name, year: data.first_air_date ? data.first_air_date.split('-')[0] : 'N/A',
            rating: data.vote_average ? data.vote_average.toFixed(1) : 'N/A',
            poster: data.poster_path ? IMG_URL + data.poster_path : 'https://placehold.co/500x750/1a1a1a/e50914?text=No+Poster',
            overview: data.overview || 'Përshkrimi nuk është i disponueshëm.',
            genres: data.genres ? data.genres.map(g => g.name).join(', ') : 'N/A'
        };
    }

    function renderRow(containerId, items) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = items.map(item => `
            <div class="movie-card" onclick="openMovieModal(${item.id}, '${item.type}')">
                <img src="${item.poster}" alt="${item.title}"><h4>${item.title} (${item.year})</h4><div class="rating">⭐ ${item.rating}/10</div>
            </div>
        `).join('');
    }

    async function loadMovies() {
        const trending = await Promise.all(MOVIES.slice(0,6).map(id => fetchMovieById(id))); trending.forEach(m => m.type = 'movie'); renderRow('trendingRow', trending);
        const movies = await Promise.all(MOVIES.map(id => fetchMovieById(id))); movies.forEach(m => m.type = 'movie'); renderRow('moviesRow', movies);
        const tvShows = await Promise.all(TV_SHOWS.map(id => fetchTvById(id))); tvShows.forEach(t => t.type = 'tv'); renderRow('tvRow', tvShows);
    }

    window.openMovieModal = async function(id, type) {
        const modal = document.getElementById('movieModal');
        document.getElementById('modalTitle').innerText = 'Duke ngarkuar...';
        modal.style.display = 'flex';
        const fetchFunc = type === 'tv' ? fetchTvById : fetchMovieById;
        const item = await fetchFunc(id);
        document.getElementById('modalTitle').innerText = item.title;
        document.getElementById('modalYear').innerHTML = `<i class="fas fa-calendar"></i> ${item.year}`;
        document.getElementById('modalRating').innerHTML = `<i class="fas fa-star" style="color:#ffc107;"></i> ${item.rating}/10`;
        document.getElementById('modalOverview').innerText = item.overview;
        document.getElementById('modalGenres').innerHTML = `<i class="fas fa-tags"></i> ${item.genres}`;
        document.getElementById('modalImage').src = item.poster;
    };

    window.closeModal = function() { document.getElementById('movieModal').style.display = 'none'; };

    async function searchTMDB(query) {
        if (!query || query.length < 2) { loadMovies(); return; }
        const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=${LANGUAGE}`);
        const data = await res.json();
        const results = data.results.slice(0, 10).map(item => ({
            id: item.id, title: item.title || item.name, year: (item.release_date || item.first_air_date || '').split('-')[0] || 'N/A',
            rating: item.vote_average ? item.vote_average.toFixed(1) : 'N/A',
            poster: item.poster_path ? IMG_URL + item.poster_path : 'https://placehold.co/500x750/1a1a1a/e50914?text=No+Poster',
            type: item.media_type === 'tv' ? 'tv' : 'movie'
        }));
        renderRow('trendingRow', results);
    }

    // SLIDER LOGJIKA
    let currentSlide = 0;
    const slides = document.querySelectorAll('.hero-slide');
    const dotsContainer = document.getElementById('heroDots');
    
    function createDots() {
        slides.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        });
    }
    
    function goToSlide(index) {
        slides[currentSlide].classList.remove('active');
        document.querySelectorAll('.dot')[currentSlide].classList.remove('active');
        currentSlide = index;
        slides[currentSlide].classList.add('active');
        document.querySelectorAll('.dot')[currentSlide].classList.add('active');
    }
    
    function nextSlide() {
        let next = currentSlide + 1;
        if (next >= slides.length) next = 0;
        goToSlide(next);
    }
    
    createDots();
    setInterval(nextSlide, 5000);

    document.addEventListener('DOMContentLoaded', () => {
        loadMovies();
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            let timeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => searchTMDB(e.target.value.trim()), 500);
            });
        }
    });
</script>
</body>
</html>
