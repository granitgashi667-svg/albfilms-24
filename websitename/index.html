<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Filma dhe Seriale HD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <i class="fas fa-clapperboard"></i>
            <span>AlbFilms24</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="#" id="moviesLink">Movies</a>
            <a href="#" id="tvLink">TV Shows</a>
        </div>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search movies, TV shows..." id="searchInput">
        </div>
    </div>
</nav>

<!-- HERO SLIDER -->
<section class="hero">
    <div class="hero-slides" id="heroSlides"></div>
    <div class="hero-dots" id="heroDots"></div>
    <div class="hero-content">
        <h1>AlbFilms24</h1>
        <p>Destinacioni yt për filma dhe seriale HD. Eksploro dhe shijo pa kufi!</p>
        <button class="btn-play" onclick="scrollToContent()"><i class="fas fa-play"></i> Fillo Eksplorimin</button>
    </div>
</section>

<!-- MAIN CONTENT -->
<div class="container" id="mainContent">
    <div class="row">
        <div class="row-header">
            <h2><i class="fas fa-fire"></i> Trending Now</h2>
            <a href="#" class="view-all">View All <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="movies-row" id="trendingRow"></div>
    </div>

    <div class="row">
        <div class="row-header">
            <h2><i class="fas fa-star"></i> Popular Movies</h2>
            <a href="#" class="view-all">View All <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="movies-row" id="moviesRow"></div>
    </div>

    <div class="row">
        <div class="row-header">
            <h2><i class="fas fa-tv"></i> Popular TV Shows</h2>
            <a href="#" class="view-all">View All <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="movies-row" id="tvRow"></div>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2025 AlbFilms24. Të gjitha të drejtat e rezervuara.</p>
        <p>Made with <i class="fas fa-heart"></i> for movie lovers</p>
    </div>
</footer>

</body>
</html>
