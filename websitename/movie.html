<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlbFilms24 - Movie Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo"><i class="fas fa-clapperboard"></i><span>AlbFilms24</span></a>
        <div class="nav-links"><a href="index.html">Home</a><a href="#">Movies</a><a href="#">TV Shows</a></div>
    </div>
</nav>

<div class="movie-detail-container" id="movieDetail">
    <div class="movie-backdrop" id="movieBackdrop"></div>
    <div class="movie-detail-content">
        <div class="movie-poster"><img id="moviePoster" src="" alt=""></div>
        <div class="movie-info">
            <h1 id="movieTitle"></h1>
            <div class="movie-meta"><span id="movieYear"></span><span id="movieRating"></span><span id="movieRuntime"></span></div>
            <p id="movieOverview"></p>
            <div class="movie-genres" id="movieGenres"></div>
            <button class="watch-btn" id="watchBtn"><i class="fas fa-play"></i> Watch Now</button>
        </div>
    </div>
</div>

<footer class="footer"><div class="footer-content"><p>&copy; 2025 AlbFilms24</p></div></footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    const API_KEY = '7a98db423d6e3a5ee922a3e51a09d135';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';

    async function loadMovie() {
        if (!movieId) return;
        const res = await fetch(`${BASE_URL}/movie/${movieId}?api_key=${API_KEY}&language=en-US`);
        const movie = await res.json();
        
        document.title = `${movie.title} - AlbFilms24`;
        document.getElementById('movieTitle').innerText = movie.title;
        document.getElementById('movieYear').innerHTML = `<i class="fas fa-calendar"></i> ${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}`;
        document.getElementById('movieRating').innerHTML = `<i class="fas fa-star"></i> ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}/10`;
        document.getElementById('movieRuntime').innerHTML = `<i class="fas fa-clock"></i> ${movie.runtime ? movie.runtime + ' min' : 'N/A'}`;
        document.getElementById('movieOverview').innerText = movie.overview || 'No description available.';
        document.getElementById('movieGenres').innerHTML = movie.genres.map(g => `<span class="genre-tag">${g.name}</span>`).join('');
        document.getElementById('moviePoster').src = movie.poster_path ? IMG_URL + movie.poster_path : 'https://placehold.co/500x750/1a1a1a/e50914?text=No+Poster';
        document.getElementById('movieBackdrop').style.backgroundImage = `linear-gradient(90deg, #0a0a0a 0%, transparent 70%), url(${BACKDROP_URL + movie.backdrop_path})`;
        
        document.getElementById('watchBtn').onclick = () => {
            window.location.href = `watch.html?type=movie&id=${movieId}`;
        };
    }
    
    loadMovie();
</script>
</body>
</html>
